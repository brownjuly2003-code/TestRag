services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — set strong value in .env}
      POSTGRES_DB: ${POSTGRES_DB:-testrag}
    # Sprint 5 hardening: postgres port НЕ публикуется наружу (codex-audit#3 risk).
    # Доступ только через docker-network к rag-api/n8n. Для debug через хост — `docker compose exec postgres psql`.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testrag} -d ${POSTGRES_DB:-testrag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-api:
    build:
      context: ./rag-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-testrag}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-testrag}
      DOCS_PATH: ${DOCS_PATH:-/app/data/sample_docs}
      DOCS_MANIFEST_PATH: ${DOCS_MANIFEST_PATH:-}
      # Fix #2: после перехода word→token splitter chunks стали меньше →
      # confidence на 23pp ниже на тех же golden Q. Threshold 0.25 восстанавливает
      # refusal_accuracy=1.0 без false-accepts на off-corpus Q9 (0.208).
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-0.25}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_CHAT_MODEL: ${MISTRAL_CHAT_MODEL:-mistral-small-latest}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL:-mistral-embed}
      # Sprint 6 #1: whitelist логика вынесена в /tg/classify, rag-api теперь
      # читает ALLOWED_TELEGRAM_USER_IDS вместо n8n.
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./data/sample_docs:/app/data/sample_docs:ro
      - ./corpus:/app/corpus:ro
      - ./manifests:/app/manifests:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  n8n:
    image: n8nio/n8n:1.103.2
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-testrag}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-testrag}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY required — generate 32+ chars in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # Sprint 6 #1 partial: Code nodes больше не читают $env (issue #14 closed
      # для Code nodes), но HTTP nodes ещё читают $env.TELEGRAM_BOT_TOKEN/
      # $env.RAG_API_URL. До завершения refactor (известная проблема, см.
      # docs/known-issues.md #17), BLOCK_ENV отключён через env override —
      # дефолт остаётся "true" чтобы prod-конфиг был secure-by-default.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      RAG_API_URL: ${RAG_API_URL:-http://rag-api:8000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALLOWED_TELEGRAM_USER_IDS: ${ALLOWED_TELEGRAM_USER_IDS:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_healthy

  # Sprint 7: polling-mode TG bridge заменяет публичный webhook + cloudflared
  # tunnel. Long-poll Bot API getUpdates → POST в n8n internal /webhook/tg-poll.
  # Закрывает known-issues.md #2 (in-memory secret) + #10 (ephemeral tunnel).
  tg-poll-bridge:
    build: ./services/tg_poll_bridge
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?required}
      N8N_INTERNAL_WEBHOOK: ${N8N_INTERNAL_WEBHOOK:-http://n8n:5678/webhook/tg-poll}
      POLL_TIMEOUT_S: ${POLL_TIMEOUT_S:-25}
    depends_on:
      n8n:
        condition: service_started

volumes:
  postgres_data:
  n8n_data:
